name: poopsense

x-app-environment: &app-environment
  POOPSENSE_APP_ENV: ${POOPSENSE_APP_ENV:-demo}
  POOPSENSE_DATABASE_URL: postgresql+psycopg://poopsense:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/poopsense
  POOPSENSE_BOOTSTRAP_DEMO_DEVICE: ${POOPSENSE_BOOTSTRAP_DEMO_DEVICE:-true}
  POOPSENSE_BOOTSTRAP_DEMO_DATA: ${POOPSENSE_BOOTSTRAP_DEMO_DATA:-true}
  POOPSENSE_AUTO_CREATE_SCHEMA: "false"
  POOPSENSE_INLINE_WORKER_ENABLED: "false"
  POOPSENSE_EXTERNAL_WORKER_ENABLED: "true"
  POOPSENSE_HTTP_WORKER_ENABLED: "false"
  POOPSENSE_LLM_API_KEY: ${POOPSENSE_LLM_API_KEY:?set POOPSENSE_LLM_API_KEY}
  POOPSENSE_LLM_BASE_URL: ${POOPSENSE_LLM_BASE_URL:-https://api.deepseek.com}
  POOPSENSE_LLM_MODEL: ${POOPSENSE_LLM_MODEL:-deepseek-v4-pro}
  POOPSENSE_LLM_PROACTIVE_ENABLED: "true"
  POOPSENSE_CORS_ORIGINS: ${POOPSENSE_PUBLIC_ORIGIN:-http://localhost}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poopsense
      POSTGRES_USER: poopsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - poopsense-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poopsense -d poopsense"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../../backend
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    environment: *app-environment
    command: ["python", "-m", "app.worker", "--watch", "--limit", "100", "--poll-seconds", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${POOPSENSE_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  poopsense-db:
